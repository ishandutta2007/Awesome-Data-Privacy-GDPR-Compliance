<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="280" fill="none" viewBox="0 0 1200 280"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0a0f1d"/><stop offset="50%" stop-color="#0d1527"/><stop offset="100%" stop-color="#070a14"/></linearGradient><linearGradient id="primaryGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#6366f1"/><stop offset="100%" stop-color="#a855f7"/></linearGradient><radialGradient id="cyanOrb" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#38bdf8" stop-opacity=".35"/><stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/></radialGradient><radialGradient id="purpleOrb" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#a855f7" stop-opacity=".3"/><stop offset="100%" stop-color="#a855f7" stop-opacity="0"/></radialGradient><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path fill="none" stroke="#1e293b" stroke-opacity=".6" stroke-width=".7" d="M 40 0 L 0 0 0 40"/></pattern><style>@keyframes pulseOrb{0%{transform:scale(1) translate(0,0);opacity:.3}50%{transform:scale(1.18) translate(15px,-10px);opacity:.55}}@keyframes floatShield{0%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(-8px) rotate(1deg)}}@keyframes radarSweep{0%{transform:rotate(0deg)}}@keyframes dataStream{0%{stroke-dashoffset:200}}.anim-orb-1{animation:pulseOrb 8s ease-in-out infinite alternate;transform-origin:200px 140px}.anim-orb-2{animation:pulseOrb 10s ease-in-out infinite alternate-reverse;transform-origin:1000px 140px}.anim-radar,.anim-shield{transform-origin:1060px 140px}.anim-shield{animation:floatShield 6s ease-in-out infinite}.anim-radar{animation:radarSweep 12s linear infinite}.anim-stream{stroke-dasharray:12,12;animation:dataStream 4s linear infinite}</style></defs><rect width="1200" height="280" fill="url(#bgGrad)" rx="16"/><rect width="1200" height="280" fill="url(#grid)" rx="16"/><circl