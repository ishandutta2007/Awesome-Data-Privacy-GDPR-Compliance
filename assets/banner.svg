<svg width="100%" height="280" viewBox="0 0 1200 280" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0d1527" />
      <stop offset="100%" stop-color="#070a14" />
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <!-- Glowing Orbs Gradients -->
    <radialGradient id="cyanOrb" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="purpleOrb" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0" />
    </radialGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.7" stroke-opacity="0.6"/>
    </pattern>

    <!-- Dynamic Pulse & Radar Animations -->
    <style>
      @keyframes pulseOrb {
        0%, 100% { transform: scale(1) translate(0px, 0px); opacity: 0.3; }
        50% { transform: scale(1.18) translate(15px, -10px); opacity: 0.55; }
      }
      @keyframes floatShield {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-8px) rotate(1deg); }
      }
      @keyframes radarSweep {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes dataStream {
        0% { stroke-dashoffset: 200; }
        100% { stroke-dashoffset: 0; }
      }
      .anim-orb-1 { animation: pulseOrb 8s ease-in-out infinite alternate; transform-origin: 200px 140px; }
      .anim-orb-2 { animation: pulseOrb 10s ease-in-out infinite alternate-reverse; transform-origin: 1000px 140px; }
      .anim-shield { animation: floatShield 6s ease-in-out infinite; transform-origin: 1060px 140px; }
      .anim-radar { animation: radarSweep 12s linear infinite; transform-origin: 1060px 140px; }
      .anim-stream { stroke-dasharray: 12, 12; animation: dataStream 4s linear infinite; }
    </style>
  </defs>

  <!-- Background Layer -->
  <rect width="1200" height="280" rx="16" fill="url(#bgGrad)" />
  <rect width="1200" height="280" rx="16" fill="url(#grid)" />

  <!-- Animated Glowing Background Orbs (Behind content) -->
  <circle class="anim-orb-1" cx="220" cy="140" r="160" fill="url(#cyanOrb)" />
  <circle class="anim-orb-2" cx="1020" cy="140" r="180" fill="url(#purpleOrb)" />

  <!-- Decorative Circuit / Stream Vectors -->
  <path class="anim-stream" d="M 50 240 L 320 240 L 380 200 L 700 200" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.35" />
  <path class="anim-stream" d="M 850 50 L 960 50 L 1000 80 L 1150 80" fill="none" stroke="#a855f7" stroke-width="1.5" stroke-opacity="0.4" />

  <!-- Right Visual: Dynamic Privacy Shield & Compliance Radar (Kept to far right) -->
  <g class="anim-radar">
    <circle cx="1060" cy="140" r="85" fill="none" stroke="#38bdf8" stroke-width="1" stroke-dasharray="6, 8" opacity="0.3" />
    <circle cx="1060" cy="140" r="60" fill="none" stroke="#6366f1" stroke-width="1" stroke-dasharray="4, 6" opacity="0.4" />
    <line x1="1060" y1="140" x2="1145" y2="140" stroke="#38bdf8" stroke-width="1.5" opacity="0.5" />
  </g>
  <g class="anim-shield">
    <polygon points="1060,88 1115,110 1115,160 1060,192 1005,160 1005,110" fill="#111827" stroke="url(#primaryGrad)" stroke-width="2.5" opacity="0.9" />
    <!-- Lock / Check Icon Inside Shield -->
    <path d="M 1052 134 V 126 C 1052 121.5 1055.5 118 1060 118 C 1064.5 118 1068 121.5 1068 126 V 134 H 1072 V 154 H 1048 V 134 H 1052 Z M 1055 134 H 1065 V 126 C 1065 123.2 1062.8 121 1060 121 C 1057.2 121 1055 123.2 1055 126 V 134 Z" fill="#38bdf8" />
  </g>

  <!-- Foreground Content: Fully Legible & Unobstructed -->
  <!-- Top Category Pill -->
  <g transform="translate(60, 36)">
    <rect width="260" height="28" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <circle cx="14" cy="14" r="5" fill="#10b981" />
    <text x="28" y="18" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="0.5">CURATED AWESOME ECOSYSTEM</text>
  </g>

  <!-- Title (Foreground) -->
  <text x="60" y="112" fill="url(#primaryGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="40" font-weight="800" letter-spacing="-0.5">Awesome Data Privacy &amp; GDPR</text>

  <!-- Subtitle (Foreground) -->
  <text x="60" y="148" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="19" font-weight="500">
    Enterprise Compliance, Consent Management, DSAR Automation &amp; Governance
  </text>

  <!-- Tagline / Framework Badges (Foreground) -->
  <g transform="translate(60, 185)">
    <!-- Pill 1: GDPR -->
    <rect x="0" y="0" width="80" height="26" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />
    <text x="14" y="17" fill="#38bdf8" font-family="sans-serif" font-size="12" font-weight="700">GDPR</text>

    <!-- Pill 2: CCPA/CPRA -->
    <rect x="90" y="0" width="105" height="26" rx="6" fill="#1e293b" stroke="#6366f1" stroke-width="1" />
    <text x="103" y="17" fill="#818cf8" font-family="sans-serif" font-size="12" font-weight="700">CCPA/CPRA</text>

    <!-- Pill 3: ISO 27701 -->
    <rect x="205" y="0" width="95" height="26" rx="6" fill="#1e293b" stroke="#a855f7" stroke-width="1" />
    <text x="216" y="17" fill="#c084fc" font-family="sans-serif" font-size="12" font-weight="700">ISO 27701</text>

    <!-- Pill 4: EU AI Act -->
    <rect x="310" y="0" width="95" height="26" rx="6" fill="#1e293b" stroke="#10b981" stroke-width="1" />
    <text x="323" y="17" fill="#34d399" font-family="sans-serif" font-size="12" font-weight="700">EU AI ACT</text>

    <!-- Pill 5: Open Source & SaaS -->
    <rect x="415" y="0" width="165" height="26" rx="6" fill="#1e293b" stroke="#64748b" stroke-width="1" />
    <text x="427" y="17" fill="#cbd5e1" font-family="sans-serif" font-size="12" font-weight="600">SaaS &amp; Open Source</text>
  </g>

  <!-- Border Frame -->
  <rect x="1" y="1" width="1198" height="278" rx="15" fill="none" stroke="#334155" stroke-width="1.2" stroke-opacity="0.8" />
</svg>
